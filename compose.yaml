services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
  dealers:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo:27017/dealershipsDB
    depends_on:
      - mongo
    restart: on-failure
  sentiment:
    build: ./server/djangoapp/microservices
  django:
    build: .
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_HTTPS: "${DJANGO_HTTPS:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_DB_PATH: /data/db.sqlite3
      backend_url: http://dealers:3030
      sentiment_analyzer_url: http://sentiment:5050
    volumes:
      - django-data:/data
    depends_on:
      - dealers
      - sentiment
volumes:
  mongo-data:
  django-data:
