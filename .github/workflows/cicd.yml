name: Capstone CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Build and start the services
        run: docker compose up --build -d
      - name: Check Django and migrations
        run: |
          docker compose exec -T django python manage.py check
          docker compose exec -T django python manage.py makemigrations --check --dry-run
      - name: Run dealership, reviews, catalogue and sentiment smoke checks
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8000
          curl -fsS --retry 24 --retry-delay 3 --retry-all-errors "$base/djangoapp/get_dealers" | jq -e '.dealers | length > 0'
          curl -fsS "$base/djangoapp/get_dealers/Kansas" | jq -e '.dealers | length > 0 and all(.state == "Kansas")'
          curl -fsS "$base/djangoapp/dealer/8" | jq -e '.dealer[0].id == 8'
          curl -fsS "$base/djangoapp/reviews/dealer/8" | jq -e '.reviews | type == "array"'
          curl -fsS "$base/djangoapp/get_cars" | jq -e '(.CarMakes | length > 0) and (.CarModels | length > 0)'
          curl -fsS "$base/" | grep -q 'id="root"'
          docker compose exec -T sentiment python -c 'import urllib.request; assert b"positive" in urllib.request.urlopen("http://localhost:5050/analyze/Fantastic%20services").read()'
      - name: Collect service logs
        if: always()
        run: docker compose logs
      - name: Shut down services
        if: always()
        run: docker compose down -v

  verify-code-engine-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Build the Code Engine demo image
        run: >-
          docker build -f Dockerfile.codeengine -t capstone-code-engine
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Start the image and check the public HTTP port
        run: |
          set -euo pipefail
          docker run -d --name capstone-code-engine -e DJANGO_HTTPS=0 -p 127.0.0.1:8080:8080 capstone-code-engine
          base=http://127.0.0.1:8080
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "$base/" | grep -q 'id="root"'
          curl -fsS "$base/djangoapp/get_dealers/Kansas" | jq -e '.dealers[0].state == "Kansas"'
          curl -fsS "$base/djangoapp/reviews/dealer/15" | jq -e '.reviews | length > 0'
      - name: Publish the verified Code Engine image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cars-dealership-capstone"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag capstone-code-engine "$image:$GITHUB_SHA"
          docker tag capstone-code-engine "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
      - name: Show container logs
        if: always()
        run: docker logs capstone-code-engine
